[tool.pytest.ini_options]
addopts = "-q"
# The scripts import each other as `lib.*`, exactly as they do when run from
# scripts/; tests import them the same way without touching sys.path.
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]

[tool.pyrefly]
project_includes = ["scripts/*.py", "scripts/lib/*.py"]
project_excludes = ["scripts/tests/*"]
search_path = ["scripts"]
# The scripts run on macOS; file flags (chflags, st_flags) exist only there.
python_platform = "darwin"

[tool.ruff]
# The Python macOS ships, which the scripts must run on (docs/specs/python-runtime.md).
target-version = "py39"
extend-exclude = ["scripts/site-packages", "scripts/tools"]

[tool.ruff.lint]
# Syntax errors, unused or undefined names, imports below code, bare except.
select = ["E4", "E7", "E9", "F", "E722"]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from test_media_pipeline so pytest can resolve them here read
# as redefinitions wherever a test takes them as parameters.
"scripts/tests/test_pipeline_schema.py" = ["F811"]
