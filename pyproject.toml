[tool.pytest.ini_options]
addopts = "-q"
# The scripts import each other as `lib.*`, exactly as they do when run from
# scripts/; tests import them the same way without touching sys.path.
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]

[tool.pyrefly]
project_includes = ["scripts/*.py", "scripts/lib/*.py"]
project_excludes = ["scripts/tests/*"]
search_path = ["scripts"]
