# Pipeline JSONL event and command-line schema
#
# Each stdout line from media-pipeline is a single JSON object (JSONL).
# The "event" field discriminates event types. All other fields depend on event type.
# Optional fields are omitted when absent (not null).
#
# The macOS app parses these events via JSONDecoder into PipelineEvent structs.
# Standalone scripts still use @@key=value via cli/results.emit_result() for CLI output.
#
# This file is the one place a token is defined. The script decides an outcome and
# emits it as an enumerated token; the app renders the token and never re-derives
# an outcome from whether some other field happens to be populated. Both sides are
# pinned to this file by contract tests — scripts/tests/media_pipeline/test_pipeline_schema.py
# validates every event the suite emits, and PipelineSchemaContractTests decodes the
# examples below and requires a status label for every organize_result token. Adding
# a token here without handling it in the app, or in the app without declaring it
# here, fails a test.
#
# Each event carries an `example`: a complete, valid instance used verbatim as a
# decoding fixture on the Swift side.
#
# The `cli` section at the end declares the step tokens and the flags the app passes.

events:
  pipeline_file:
    description: "Emitted at the start of processing each file"
    fields:
      file: { type: string, description: "Basename of the file being processed" }
      source_path:
        type: string
        description: "Full path the file was read from — the app's source of truth for where an unmoved row's file is"
    example:
      event: pipeline_file
      file: DJI_20250815_101112_0001.MP4
      source_path: /Volumes/SD/DCIM/100GOPRO/DJI_20250815_101112_0001.MP4

  stage_complete:
    description: "Emitted after each pipeline stage completes for a file"
    fields:
      stage:
        type: string
        enum: [ingest, tag, fix-timestamp, output, gyroflow, archive-source]
    example:
      event: stage_complete
      stage: output

  tag_result:
    description: "Result of the tag-media stage"
    fields:
      file: { type: string }
      action:
        type: string
        enum: [tagged, already_correct]
      tags_added: { type: "list[string]" }
      exif_make: { type: string }
      exif_model: { type: string }
      file_make:
        type: string
        optional: true
        description: >-
          The Make the file already carries, present only when it differs
          (ignoring case) from the profile's. The file's value is never
          overwritten; a mismatch means the profile was likely picked for
          the wrong camera.
      file_model:
        type: string
        optional: true
        description: "As file_make, for the Model"
    example:
      event: tag_result
      file: DJI_20250815_101112_0001.MP4
      action: tagged
      tags_added: [Korea]
      exif_make: DJI
      exif_model: Osmo Action 4

  timestamp_result:
    description: "Result of the fix-media-timestamp stage"
    fields:
      file: { type: string }
      action:
        type: string
        # added / would_add: every field written was empty and the file times
        # already agree — the stored time is not wrong, only incomplete.
        # metadata_skipped: exiftool refused every metadata write as a corrupted
        # Insta360 trailer (the camera's own), so only the file times were set;
        # the rename and the date folder still follow the corrected time.
        enum: [fixed, would_fix, added, would_add, metadata_skipped, no_change, error]
      original_time: { type: string, optional: true }
      corrected_time: { type: string, optional: true }
      source: { type: string, optional: true }
      timezone: { type: string, optional: true }
      correction_mode: { type: string, optional: true }
      time_offset_seconds: { type: integer, optional: true }
      time_offset_display: { type: string, optional: true }
      original_epoch: { type: number, optional: true }
      corrected_epoch: { type: number, optional: true }
      requires_force_timezone: { type: boolean, optional: true }
      camera_zone_offset: { type: string, optional: true }
      stale_fields: { type: "list[string]", optional: true }
      stale_file_times: { type: "list[string]", optional: true }
      error: { type: string, optional: true }
      reason:
        type: string
        optional: true
        enum: [birth_time_in_future]
        description: >-
          Why an error result refused the correction. birth_time_in_future: the
          corrected birth time is later than now (only --time-offset or
          --preserve-wallclock move it there), and the write's own modification time
          would stand before it, so nothing is written.
    example:
      event: timestamp_result
      file: DJI_20250815_101112_0001.MP4
      action: would_fix
      original_time: "2025:08:15 10:11:12Z"
      corrected_time: "2025:08:15 19:11:12+09:00"
      source: moviecreatedate
      timezone: "+09:00"
      correction_mode: timezone
      time_offset_seconds: 32400
      time_offset_display: "+9h"
      original_epoch: 1755252672.0
      corrected_epoch: 1755252672.0
      requires_force_timezone: false
      camera_zone_offset: "+08:00"
      stale_fields: [DateTimeOriginal, CreateDate]
      stale_file_times: [FileCreateDate]

  rename_result:
    description: "Emitted when --update-filename-dates renames a file"
    fields:
      file: { type: string, description: "Original filename" }
      renamed_to: { type: string }
    example:
      event: rename_result
      file: DJI_20250815_101112_0001.MP4
      renamed_to: DJI_20250815_191112_0001.MP4

  organize_result:
    description: "Result of the organize-by-date (output) stage"
    fields:
      file: { type: string }
      action:
        type: string
        enum: [copied, moved, skipped, overwrote, would_copy, would_move, would_overwrite, error]
        description: >-
          What happened to the file, stated relative to the source file the user
          handed the pipeline. copied means a new file now exists at the
          destination and the source is untouched — the pipeline stages every
          file through the working directory, so this is what a run reports;
          the source is only ever archived or deleted by the separate
          archive-source step, which reports that separately. moved means the
          source itself changed location, which only a pipeline that processes
          in place can report. overwrote and would_overwrite describe the
          destination: a file already there was replaced.
      dest:
        type: string
        description: >-
          Where the file would live under the target. Present for every non-error
          outcome, including skips — a destination is not evidence that anything moved.
      reason:
        type: string
        optional: true
        enum: [identical, exists_differs, user_choice]
        description: >-
          Why a skipped file was not moved. user_choice is set only after an answer
          was read back from a terminal; a dry run or a no-tty apply reports
          exists_differs instead.
    example:
      event: organize_result
      file: DJI_20250815_101112_0001.MP4
      action: skipped
      dest: /Volumes/Media/Ready/2025/2025-08-15/DJI_20250815_101112_0001.MP4
      reason: exists_differs

  gyroflow_result:
    description: "Result of the generate-gyroflow stage"
    fields:
      file: { type: string }
      action:
        type: string
        enum: [generated, skipped, would_generate]
      gyroflow_path: { type: string, optional: true }
      error: { type: string, optional: true }
    example:
      event: gyroflow_result
      file: DJI_20250815_101112_0001.MP4
      action: would_generate
      gyroflow_path: /Volumes/Media/Ready/2025/2025-08-15/DJI_20250815_101112_0001.gyroflow

  batch_check:
    description: >-
      One finding of a batch-level check (lib/media_pipeline/preflight.py CHECKS),
      emitted before the first file is processed, except destination_occupied,
      which is emitted after the batch. Every check reports before the run stops,
      so a run that meets several asks about all of them at once. The app renders
      the token and the files, and reads refused rather than working out itself
      whether this run stopped.
    fields:
      check:
        type: string
        enum: [protected_sources, camera_mismatch, mixed_timezones, zone_relabel,
               filename_unparseable, destination_occupied]
        description: >-
          protected_sources: source files carry the user-immutable flag; their
          imported copies come out unlocked. camera_mismatch: files whose
          Make/Model differ (ignoring case) from the profile's, grouped by the
          camera found; their camera fields are never overwritten.
          mixed_timezones: the batch grouped by each file's zone, with files
          that hold no zone evidence under none. zone_relabel: files whose zoned
          tag differs from --timezone, grouped by the tag's zone.
          filename_unparseable: under --infer-from-filename, files with no date
          in their name. destination_occupied: files left in place because a
          different file holds their destination; each also has its own
          organize_result with reason=exists_differs.
      files:
        type: "list[string]"
        description: "Basenames of the files the finding is about"
      groups:
        type: "map[string, list[string]]"
        optional: true
        description: "For a check that splits the batch: each label (a zone, a camera) → its files"
      assent_flag:
        type: string
        optional: true
        description: "The flag that lets a refused run go on; absent for a check that always refuses"
      refused:
        type: boolean
        description: >-
          Whether this run stopped on the finding: the check refuses this mode
          (an apply, or every run) and its assent flag was not given.
    example:
      event: batch_check
      check: mixed_timezones
      files: [VID_20261006_002802_00_001.insv, VID_20261006_203505_00_005.insv]
      groups:
        "-0700": [VID_20261006_002802_00_001.insv]
        "+0800": [VID_20261006_203505_00_005.insv]
      assent_flag: --allow-mixed-timezones
      refused: true

  no_media_files:
    description: >-
      Emitted in place of a pipeline_summary when the source holds no file with
      one of the profile's extensions, so the run ends before processing
      anything. Without it the app has no rows and no summary, and cannot tell
      an empty card from a run that never started.
    fields:
      source:
        type: string
        description: "The source directory that was searched"
      extensions:
        type: "list[string]"
        description: "The extensions the profile matches, as written in the profile"
    example:
      event: no_media_files
      source: /Volumes/Untitled/DCIM
      extensions: [.arw, .jpg]

  pipeline_error:
    description: "Emitted when the run aborts before or during file processing"
    fields:
      message: { type: string }
    example:
      event: pipeline_error
      message: "Profile 'korea' not found"

  pipeline_result:
    description: "Final result for each file, always the last event per file"
    fields:
      file: { type: string }
      result:
        type: string
        enum: [changed, would_change, unchanged, failed]
    example:
      event: pipeline_result
      file: DJI_20250815_101112_0001.MP4
      result: would_change

  pipeline_summary:
    description: >-
      Emitted once after every file has been processed, carrying the run's
      outcome as data. print_summary writes the same counts to stderr for the
      log; the app reads this event and never parses that text back out.
    fields:
      processed: { type: integer }
      succeeded: { type: integer }
      changed: { type: integer }
      failed: { type: integer }
      failed_files:
        type: "list[string]"
        description: "Basenames of the files that failed, empty when failed is 0"
      mode:
        type: string
        enum: [applied, dry_run]
        description: "Whether the run wrote the changes or only previewed them"
    example:
      event: pipeline_summary
      processed: 2
      succeeded: 1
      changed: 1
      failed: 1
      failed_files: [DJI_20250815_101112_0001.MP4]
      mode: applied

# The command line the app builds for media-pipeline. The app's PipelineStep tokens
# and flag constants, and media-pipeline's build_parser(), are both held to this
# section by the same contract tests as the events above.
cli:
  # Every step in pipeline order. `stage` is the token stage_complete carries; `task`
  # is the token --tasks accepts. A step without a task is the fixed frame: it always
  # runs and cannot be named in --tasks.
  steps:
    - { stage: ingest }
    - { stage: tag, task: tag }
    - { stage: fix-timestamp }
    - { stage: output }
    - { stage: gyroflow, task: gyroflow }
    - { stage: archive-source, task: archive-source }

  # Every flag the app passes.
  flags: [--profile, --source, --target, --tags, --make, --model, --group, --tasks,
          --archive-destination, --archived-name, --copy-companion-files, --timezone,
          --infer-from-filename, --time-offset, --update-filename-dates, --gyroflow-preset,
          --force-timezone, --allow-mixed-timezones, --overwrite, --unlock-protected,
          --allow-camera-mismatch, --apply]

  # The flags that carry an answer the user gave for one run rather than a setting:
  # a run started fresh drops them, and they never make a dry run's preview stale.
  assent_flags: [--force-timezone, --allow-mixed-timezones, --overwrite, --unlock-protected,
                 --allow-camera-mismatch, --apply]
