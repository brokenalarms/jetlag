name: CI

on:
  pull_request:

permissions:
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - name: Install system tools
        timeout-minutes: 5
        run: |
          # azure.archive.ubuntu.com is flaky and apt retries it until the step
          # times out; drop it so apt goes straight to archive.ubuntu.com
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y ffmpeg libimage-exiftool-perl

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt

      - name: Run tests
        run: pytest scripts/tests/ -x
