name: CI

on:
  pull_request:

permissions:
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - name: Install system tools
        timeout-minutes: 5
        run: |
          # azure.archive.ubuntu.com is flaky and apt retries it until the step
          # times out; drop it so apt goes straight to archive.ubuntu.com
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y ffmpeg libimage-exiftool-perl

      # make builds scripts/.venv from both requirements files and runs the
      # suite in parallel, the same way it runs locally
      - name: Run script tests
        run: make test-scripts

      - name: Lint and type-check scripts
        run: make lint

  web-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test and build the site
        run: make test-web

      - name: Check colour sets against design tokens
        run: make test-design
