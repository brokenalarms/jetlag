name: CI

on:
  pull_request:

permissions:
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - name: Install system tools
        timeout-minutes: 5
        run: |
          # azure.archive.ubuntu.com is flaky and apt retries it until the step
          # times out; drop it so apt goes straight to archive.ubuntu.com
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y ffmpeg libimage-exiftool-perl

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt

      - name: Check for scripts changes
        id: scripts-changed
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- scripts/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare perf baseline from main
        if: steps.scripts-changed.outputs.changed == 'true'
        run: |
          git fetch --depth=1 origin main
          mkdir -p /tmp/perf_baseline
          git archive origin/main scripts | tar -x -C /tmp/perf_baseline
          ln -s "$GITHUB_WORKSPACE/scripts/tools" /tmp/perf_baseline/scripts/tools

      - name: Run tests
        run: pytest scripts/tests/ -x --ignore=scripts/tests/test_performance.py

      - name: Run perf comparison
        if: steps.scripts-changed.outputs.changed == 'true'
        run: pytest scripts/tests/test_performance.py -v -s --tb=short --perf-baseline-scripts-dir=/tmp/perf_baseline/scripts --perf-results-file=/tmp/perf_results.json

      - name: Performance summary
        if: always() && steps.scripts-changed.outputs.changed == 'true'
        run: python3 .github/scripts/perf_summary.py
