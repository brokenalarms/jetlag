name: CI

on:
  pull_request:

permissions:
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXIFTOOL_VERSION: "13.55"
      FFMPEG_SERIES: "9.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      # The tools come from GitHub, not apt: the runners often cannot resolve
      # Ubuntu's archive mirrors, and apt then retries until the job times out.
      # rsync and perl are already on the runner image.
      - name: Cache system tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: tools-exiftool-${{ env.EXIFTOOL_VERSION }}-ffmpeg-${{ env.FFMPEG_SERIES }}

      - name: Download system tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ~/tools/exiftool ~/tools/ffmpeg
          curl -fsSL --retry 3 "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz" \
            | tar -xz -C ~/tools/exiftool --strip-components=1
          curl -fsSL --retry 3 "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n${FFMPEG_SERIES}-latest-linux64-gpl-${FFMPEG_SERIES}.tar.xz" \
            | tar -xJ -C ~/tools/ffmpeg --strip-components=1

      - name: Put system tools on PATH
        run: |
          echo ~/tools/exiftool >> "$GITHUB_PATH"
          echo ~/tools/ffmpeg/bin >> "$GITHUB_PATH"

      - name: Check system tools
        run: |
          exiftool -ver
          ffmpeg -version | head -1
          ffprobe -version | head -1
          rsync --version | head -1

      # make builds scripts/.venv from both requirements files and runs the
      # suite in parallel, the same way it runs locally
      - name: Run script tests
        run: make test-scripts

      - name: Lint and type-check scripts
        run: make lint

  web-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test and build the site
        run: make test-web

      - name: Check colour sets against design tokens
        run: make test-design
