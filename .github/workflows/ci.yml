name: CI

on:
  pull_request:

permissions:
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - name: Install system tools
        timeout-minutes: 5
        run: |
          # azure.archive.ubuntu.com is flaky and apt retries it until the step
          # times out; drop it so apt goes straight to archive.ubuntu.com
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y ffmpeg libimage-exiftool-perl

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt

      - name: Record perf baseline from main
        run: |
          git ls-tree --name-only origin/main -- scripts/*.py scripts/*.sh scripts/lib/ | xargs -r git checkout origin/main --
          pytest scripts/tests/test_performance.py --perf-baseline --perf-baseline-file /tmp/perf_baseline.json -v -s
          git checkout ${{ github.sha }} -- scripts/

      - name: Run tests
        run: pytest scripts/tests/ -x --ignore=scripts/tests/test_performance.py

      - name: Run perf comparison
        run: pytest scripts/tests/test_performance.py -v -s --tb=short --perf-baseline-file /tmp/perf_baseline.json --perf-results-file /tmp/perf_results.json

      - name: Performance summary
        if: always()
        run: python3 .github/scripts/perf_summary.py
